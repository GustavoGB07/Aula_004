<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias</title>
</head>
<body>

    <figure>
        <img title="perfil" src="midia/perfil.png" alt="Perfil" width="100" height="100">
        <figcaption>
            Foto de perfil.
        </figcaption>
    </figure>

    <h2 id="musica">Uma música que gosto</h2>
    <p>Música da banda Queen</p>
    <audio controls autoplay muted autoplay loop controls preload="none" src="midia/audio.mp3">
        Seu navegador não oferece suporte ao elemento audio.
    </audio>

    <p><a href="midia/audio.mp3">Abrir o arquivo de áudio</a></p>

    <h2 id="video">Vídeo</h2>
    <video controls preload="metadata" width="640" poster="midia/zelda.png" playsinline>
        <source src="midia/subtitles/video.mp4" type="video/mp4">
        Seu navegador não oferece suporte ao elemento video.
    </video>
    <p><a href="midia/subtitles/video.mp4">Link pro vídeo</a></p>

    <h2>Video com legendas</h2>
    <video controls width="640">
        <source src="midia/subtitles/video.mp4" type="video/mp4">
        <track src="midia/subtitles/legendas-pt.vtt" kind="captions" srclang="pt-BR" label="Português" default>
        <track src="midia/subtitles/lengendas-en.vtt" kind="captions" srclang="en" label="English" default>
    </video>

</body>
</html>
